name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  version-check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version_check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version changed
        id: version_check
        run: |
          CURRENT=${{ steps.version.outputs.version }}
          git show HEAD~1:pyproject.toml > /tmp/prev_pyproject.toml 2>/dev/null || echo 'version = "0.0.0"' > /tmp/prev_pyproject.toml
          PREVIOUS=$(grep '^version = ' /tmp/prev_pyproject.toml | sed 's/version = "\(.*\)"/\1/' || echo "0.0.0")
          echo "Current: $CURRENT, Previous: $PREVIOUS"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build-windows:
    name: Build wheel (win_amd64)
    needs: version-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.6.3'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          log-file-suffix: 'win_amd64.txt'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - name: Build wheel
        run: python setup.py bdist_wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-win_amd64
          path: dist/
          retention-days: 5

  build-linux:
    name: Build wheel (manylinux_2_28_x86_64)
    needs: version-check
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA 12.6 headers and driver stub
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --add-repo \
            https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
          dnf install -y cuda-cudart-devel-12-6 cuda-driver-devel-12-6
          echo "CUDA_PATH=/usr/local/cuda-12.6" >> $GITHUB_ENV

      - name: Install build dependencies
        run: /opt/python/cp39-cp39/bin/pip install setuptools wheel auditwheel

      - name: Build wheel
        run: /opt/python/cp39-cp39/bin/python setup.py bdist_wheel

      - name: Repair wheel with auditwheel
        run: |
          # auditwheel resolves libraries via ldconfig, not LD_LIBRARY_PATH.
          # The CUDA driver stub (libcuda.so) is installed by cuda-driver-devel
          # but has no .so.1 symlink and is not in ldconfig's search path.
          # Create the versioned symlink and register it so auditwheel finds it.
          # libcuda.so.1 is on the manylinux external-libs whitelist — it will
          # not be bundled into the wheel, only used for symbol resolution.
          ln -sf /usr/local/cuda-12.6/lib64/stubs/libcuda.so /usr/local/lib64/libcuda.so.1
          ldconfig
          /opt/python/cp39-cp39/bin/auditwheel repair dist/*.whl \
            -w dist/repaired/
          rm dist/*.whl
          mv dist/repaired/*.whl dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux_x86_64
          path: dist/
          retention-days: 5

  publish:
    name: Publish to PyPI
    needs: [version-check, build-windows, build-linux]
    if: needs.version-check.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          files: dist/*
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_ACCESS_TOKEN }}
          packages-dir: dist/
